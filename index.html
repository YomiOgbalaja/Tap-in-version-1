<title>Tap In</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<style>
/* ============ TOKENS — LinkedIn-inspired professional palette ============ */
:root{
  color-scheme: light;
  --ink-900:#1b1f23; --ink-700:#434f59; --ink-500:#5e6d77; --ink-300:#a6b3bb; --ink-150:#dce4e9;
  --paper-0:#f4f2ee; --paper-1:#ffffff; --paper-2:#f8f7f4; --line:#dfe3e6; --line-soft:#ebedee;
  --accent:#0a66c2; --accent-ink:#004182; --accent-soft:#e7f3ff; --accent-strong:#004182;
  --amplify:#9a6400; --amplify-soft:#f7e6cc;
  --good:#057642; --warning:#915907; --serious:#a6501f; --critical:#b0210f;
  --good-soft:#e0f5e9; --warning-soft:#fbeece; --serious-soft:#fbe4da; --critical-soft:#fadedb;
  --cat-1:#2a78d6; --cat-2:#c95a22; --cat-3:#1baf7a; --cat-4:#b5820a; --cat-5:#c15c86; --cat-6:#177a17; --cat-7:#4a3aa7; --cat-8:#c94141;
  --shadow-1: 0 1px 2px rgba(16,23,26,.08), 0 1px 1px rgba(16,23,26,.05);
  --shadow-2: 0 8px 24px rgba(16,23,26,.14), 0 2px 6px rgba(16,23,26,.07);
  --font-display:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
/* Dark-mode auto-switching intentionally removed — this workspace always renders the light, white/blue palette per explicit request. */
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper-0); color:var(--ink-900); font-family:var(--font-body);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.015em;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
a{color:var(--accent-strong);}
.mono{font-family:var(--font-mono);}
.tabular{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

/* ============ SHELL ============ */
#shell{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}
#rail{
  background:var(--paper-1); border-right:1px solid var(--line); padding:20px 14px;
  display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:9px; padding:0 6px;}
.brand-mark{width:28px; height:28px; flex:none;}
.brand-word{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-.02em; color:var(--ink-900);}
.brand-tag{font-size:10.5px; color:var(--ink-500); padding:0 6px; line-height:1.3; margin-top:-4px;}

.persona-switch{display:flex; flex-direction:column; gap:5px;}
.rail-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-500); padding:0 6px; font-weight:600;}
.persona-btn{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:9px; border:1px solid transparent;
  background:none; color:var(--ink-700); text-align:left; cursor:pointer; font-size:13px; font-weight:500;
}
.persona-btn:hover{background:var(--paper-2);}
.persona-btn.active{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-soft);}
.persona-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-300); flex:none;}
.persona-btn.active .dot{background:var(--accent);}

.persona-context{padding:8px 9px; background:var(--paper-2); border:1px solid var(--line-soft); border-radius:9px; font-size:12px; color:var(--ink-700);}
.persona-context select{width:100%; margin-top:5px; font:inherit; font-size:12.5px; padding:6px 7px; border-radius:7px; border:1px solid var(--line); background:var(--paper-1); color:var(--ink-900);}

nav.section-nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; border:none;
  background:none; color:var(--ink-700); text-align:left; cursor:pointer; font-size:13px; width:100%;
}
.nav-item:hover{background:var(--paper-2); color:var(--ink-900);}
.nav-item.active{background:var(--ink-900); color:var(--paper-0); font-weight:600;}
.nav-item svg{flex:none;}

.rail-foot{margin-top:auto; padding:10px 9px; border-top:1px solid var(--line-soft); font-size:11px; color:var(--ink-500);}

#main-col{display:flex; flex-direction:column; min-width:0;}
#topbar{
  position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--paper-0) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
#topbar h1{font-size:21px;}
#topbar .sub{font-size:12.5px; color:var(--ink-500); margin-top:2px;}
.topbar-main{display:flex; align-items:center; gap:10px; min-width:0;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.rail-toggle{display:none; background:none; border:1px solid var(--line); border-radius:8px; width:36px; height:36px; align-items:center; justify-content:center; color:var(--ink-700); cursor:pointer; flex:none;}
.range-select{font:inherit; font-size:12.5px; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper-1); color:var(--ink-700);}
.btn{
  font:inherit; font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:8px; border:1px solid var(--line);
  background:var(--paper-1); color:var(--ink-900); cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--ink-300);}
.btn.primary{background:var(--ink-900); color:var(--paper-0); border-color:var(--ink-900);}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn.ask{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.ask:hover{background:var(--accent-strong); border-color:var(--accent-strong);}

#main{padding:22px 26px 60px; display:flex; flex-direction:column; gap:22px; max-width:1360px; width:100%;}
#rail-backdrop{position:fixed; inset:0; background:rgba(10,14,15,.36); z-index:44; opacity:0; pointer-events:none; transition:opacity .2s;}
#rail-backdrop.open{opacity:1; pointer-events:auto;}

/* ============ MOBILE / RESPONSIVE ============ */
@media (max-width: 880px){
  #shell{grid-template-columns:1fr;}
  #rail{
    position:fixed; top:0; left:0; z-index:45; width:280px; max-width:84vw; height:100vh;
    transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow-2);
  }
  #rail.open{transform:translateX(0);}
  .rail-toggle{display:inline-flex;}
  #topbar{padding:12px 14px; gap:8px;}
  #topbar h1{font-size:17px;}
  #main{padding:14px 14px 48px; gap:16px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .card{padding:14px;}
  #assist-toggle{right:16px; bottom:16px; width:50px; height:50px;}
  #assist-drawer{width:100vw; max-width:100vw;}
}
@media (max-width: 480px){
  .kpi-row{grid-template-columns:1fr 1fr; gap:8px;}
  .kpi .value{font-size:24px;}
  #topbar h1{font-size:16px;}
  .topbar-actions{gap:6px;}
  .range-select{padding:6px 7px; font-size:11.5px;}
  .btn{padding:7px 9px; font-size:11.5px;}
}

/* ============ KPI TILES ============ */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px;}
.kpi{background:var(--paper-1); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-1);}
.kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-500); font-weight:600;}
.kpi .value{font-family:var(--font-display); font-size:30px; font-weight:600; margin-top:5px; display:flex; align-items:baseline; gap:6px;}
.kpi .value .unit{font-size:15px; color:var(--ink-500); font-weight:500;}
.kpi .delta{font-size:12px; margin-top:4px; font-weight:600; display:inline-flex; align-items:center; gap:4px;}
.delta.up-good{color:var(--good);} .delta.up-bad{color:var(--critical);} .delta.down-good{color:var(--good);} .delta.down-bad{color:var(--critical);} .delta.flat{color:var(--ink-500);}

/* ============ CARDS / GRID ============ */
.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr;}}
.card{background:var(--paper-1); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow-1);}
.card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px;}
.card-head h3{font-size:15.5px; font-weight:600; font-family:var(--font-body);}
.card-head .hint{font-size:11.5px; color:var(--ink-500);}
.section-title{font-size:24px; margin-bottom:2px;}
.section-desc{font-size:13px; color:var(--ink-500); max-width:62ch;}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--ink-700); margin-top:10px;}
.legend .item{display:flex; align-items:center; gap:6px;}
.legend .swatch{width:9px;height:9px;border-radius:2px;}

/* ============ TABLES ============ */
.table-wrap{overflow-x:auto; border:1px solid var(--line-soft); border-radius:10px;}
table{border-collapse:collapse; width:100%; font-size:12.8px; min-width:640px;}
th{
  text-align:left; padding:9px 12px; background:var(--paper-2); color:var(--ink-500); font-weight:600;
  font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line); white-space:nowrap;
  position:sticky; top:0;
}
td{padding:9px 12px; border-bottom:1px solid var(--line-soft); color:var(--ink-700); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--paper-2);}
td.name{color:var(--ink-900); font-weight:600;}
.subtle{color:var(--ink-500); font-size:11.5px;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:11.3px; font-weight:600; white-space:nowrap;}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.warning{background:var(--warning-soft); color:var(--warning);}
.pill.serious{background:var(--serious-soft); color:var(--serious);}
.pill.critical{background:var(--critical-soft); color:var(--critical);}
.pill.neutral{background:var(--paper-2); color:var(--ink-500); border:1px solid var(--line-soft);}
.pill .pdot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.bar-cell{display:flex; align-items:center; gap:8px;}
.bar-track{flex:1; height:6px; border-radius:4px; background:var(--paper-2); overflow:hidden; min-width:50px;}
.bar-fill{height:100%; border-radius:4px; background:var(--accent);}

input.search{
  font:inherit; font-size:12.5px; padding:7px 11px; border-radius:8px; border:1px solid var(--line);
  background:var(--paper-1); color:var(--ink-900); width:220px;
}

/* ============ AMPLIFIER / COACHING CARDS ============ */
.amp-card{border:1px solid var(--line); border-radius:12px; padding:13px 14px; background:var(--paper-2); display:flex; gap:12px;}
.amp-card + .amp-card{margin-top:9px;}
.amp-icon{width:30px; height:30px; border-radius:9px; background:var(--amplify-soft); color:var(--amplify); display:flex; align-items:center; justify-content:center; flex:none;}
.amp-body{flex:1; min-width:0;}
.amp-title{font-weight:600; font-size:13.3px; color:var(--ink-900);}
.amp-desc{font-size:12.5px; color:var(--ink-700); margin-top:2px;}
.amp-meta{display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap;}
.amp-badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:5px; background:var(--amplify-soft); color:var(--amplify);}
.amp-done-btn{margin-left:auto; font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:7px; border:1px solid var(--line); background:var(--paper-1); color:var(--ink-700); cursor:pointer;}
.amp-done-btn:hover{border-color:var(--good); color:var(--good);}
.amp-card.done{opacity:.45;}
.amp-card.done .amp-title{text-decoration:line-through;}

.report-box{white-space:pre-wrap; font-family:var(--font-mono); font-size:11.8px; line-height:1.65; background:var(--paper-2); border:1px solid var(--line-soft); border-radius:10px; padding:16px; max-height:480px; overflow:auto;}

/* ============ AGENT ============ */
.agent-intro{background:linear-gradient(180deg,var(--accent-soft),var(--paper-1) 65%);}
.priority-list{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:10px; font-size:13px; color:var(--ink-900);}
.priority-list li::marker{font-weight:700; color:var(--accent-ink);}
.draft-msg{border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--paper-2);}
.draft-msg + .draft-msg{margin-top:10px;}
.draft-msg-head{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:600; color:var(--ink-500); text-transform:uppercase; letter-spacing:.04em; margin-bottom:7px;}
.draft-subject{font-weight:600; font-size:13px; color:var(--ink-900); margin-bottom:5px;}
.draft-body{white-space:pre-wrap; font-family:var(--font-body); font-size:12.8px; line-height:1.55; color:var(--ink-700); margin:0;}

/* ============ 9-BOX GRID ============ */
.ninebox-grid{display:grid; grid-template-columns:20px repeat(3,1fr); grid-template-rows:repeat(3,90px) 20px; gap:6px; max-width:640px;}
.ninebox-axis-y{grid-row:1/4; writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; font-size:11px; color:var(--ink-500); font-weight:600;}
.ninebox-axis-x{grid-column:2/5; text-align:center; font-size:11px; color:var(--ink-500); font-weight:600;}
.ninebox-cell{border-radius:10px; border:1px solid var(--line-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:var(--paper-2);}
.ninebox-cell.tier-good{background:var(--good-soft); border-color:var(--good);}
.ninebox-cell.tier-critical{background:var(--critical-soft); border-color:var(--critical);}
.ninebox-n{font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--ink-900);}
.ninebox-label{font-size:10.5px; font-weight:600; color:var(--ink-700); text-align:center; padding:0 4px;}
.ninebox-pct{font-size:10px; color:var(--ink-500);}

/* ============ INTEGRATIONS ============ */
.integration-card{display:flex; gap:13px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:15px; background:var(--paper-1);}
.integration-logo{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; font-family:var(--font-display); font-weight:700; font-size:15px; color:#fff;}
.integration-body{flex:1; min-width:0;}
.integration-name{font-weight:600; font-size:14px; color:var(--ink-900); display:flex; align-items:center; gap:8px;}
.integration-meta{font-size:11.8px; color:var(--ink-500); margin-top:3px;}
.integration-fields{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px;}
.field-chip{font-size:10.8px; padding:2px 7px; border-radius:5px; background:var(--paper-2); border:1px solid var(--line-soft); color:var(--ink-700); font-family:var(--font-mono);}

/* ============ ASSISTANT DRAWER ============ */
#assist-toggle{
  position:fixed; right:26px; bottom:26px; z-index:30; width:56px; height:56px; border-radius:50%;
  background:var(--accent); color:#fff; border:none; box-shadow:var(--shadow-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#assist-toggle .ring{position:absolute; inset:-6px; border:2px solid var(--accent); border-radius:50%; opacity:.5; animation:pulse-ring 2.4s ease-out infinite;}
@keyframes pulse-ring{0%{transform:scale(.85); opacity:.55;} 100%{transform:scale(1.35); opacity:0;}}
@media (prefers-reduced-motion: reduce){#assist-toggle .ring{animation:none; display:none;}}

#assist-drawer{
  position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw; background:var(--paper-1);
  border-left:1px solid var(--line); box-shadow:var(--shadow-2); z-index:40; display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .28s ease;
}
#assist-drawer.open{transform:translateX(0);}
.assist-head{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
.assist-tabs{display:flex; gap:4px; padding:8px 10px 0; border-bottom:1px solid var(--line);}
.assist-tab{flex:1; font:inherit; font-size:12px; font-weight:600; padding:8px 6px; border:none; background:none; color:var(--ink-500); cursor:pointer; border-bottom:2px solid transparent; border-radius:0;}
.assist-tab:hover{color:var(--ink-900);}
.assist-tab.active{color:var(--accent-ink); border-bottom-color:var(--accent);}
.assist-head h3{font-size:16px;}
.assist-head .sub{font-size:11.5px; color:var(--ink-500); margin-top:2px;}
.icon-btn{background:none; border:none; color:var(--ink-500); cursor:pointer; padding:6px; border-radius:7px;}
.icon-btn:hover{background:var(--paper-2); color:var(--ink-900);}
.assist-msgs{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px;}
.msg{max-width:88%; font-size:13px; line-height:1.55; padding:9px 12px; border-radius:12px;}
.msg.user{align-self:flex-end; background:var(--ink-900); color:var(--paper-0); border-bottom-right-radius:4px;}
.msg.bot{align-self:flex-start; background:var(--paper-2); color:var(--ink-900); border:1px solid var(--line-soft); border-bottom-left-radius:4px; white-space:pre-wrap;}
.msg.bot.thinking{color:var(--ink-500); font-style:italic;}
.msg.sys{align-self:center; font-size:11.5px; color:var(--ink-500); background:none;}
.assist-suggest{display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px;}
.chip-btn{font-size:11.5px; padding:6px 10px; border-radius:100px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink-700); cursor:pointer;}
.chip-btn:hover{border-color:var(--accent); color:var(--accent-ink);}
.assist-input{display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line);}
.assist-input input{flex:1; font:inherit; font-size:13px; padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--paper-0); color:var(--ink-900);}
.assist-input button{width:38px; height:38px; border-radius:9px; border:none; background:var(--accent); color:#fff; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center;}
.assist-input button:disabled{opacity:.5; cursor:default;}
#assist-backdrop{position:fixed; inset:0; background:rgba(10,14,15,.28); z-index:35; opacity:0; pointer-events:none; transition:opacity .2s;}
#assist-backdrop.open{opacity:1; pointer-events:auto;}

/* ============ DRILL-DOWN DETAIL MODAL ============ */
.drill-link{cursor:pointer; text-decoration:none; border-bottom:1px dashed var(--ink-300); transition:border-color .12s;}
.drill-link:hover{border-color:var(--accent); color:var(--accent-ink);}
.kpi-link{cursor:pointer;}
.kpi-link:hover .value{color:var(--accent-ink);}
.kpi-link .value{transition:color .12s;}
#modal-backdrop{position:fixed; inset:0; background:rgba(10,14,15,.4); z-index:55; opacity:0; pointer-events:none; transition:opacity .18s; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:5vh 16px;}
#modal-backdrop.open{opacity:1; pointer-events:auto;}
.modal-card{background:var(--paper-1); border-radius:16px; box-shadow:var(--shadow-2); width:100%; max-width:640px; margin-top:0; transform:translateY(-8px); transition:transform .18s; overflow:hidden;}
#modal-backdrop.open .modal-card{transform:translateY(0);}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px 14px; border-bottom:1px solid var(--line-soft);}
.modal-head h3{font-size:19px;}
.modal-head .sub{font-size:12.5px; color:var(--ink-500); margin-top:3px;}
.modal-body{padding:18px 22px 22px; max-height:70vh; overflow-y:auto;}
.modal-kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:16px;}
.modal-kpi{background:var(--paper-2); border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px;}
.modal-kpi .label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-500); font-weight:600;}
.modal-kpi .value{font-family:var(--font-display); font-size:20px; font-weight:700; margin-top:3px;}

.empty-note{font-size:12.5px; color:var(--ink-500); padding:20px; text-align:center;}

<script>
(function(){
"use strict";

/* ================================================================
   1. SEEDED RNG + MOCK DATA GENERATION (simulated Workday-style HRIS export)
   ================================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(88771234);
function ri(a,b){return Math.floor(rand()*(b-a+1))+a;}
function rf(a,b){return rand()*(b-a)+a;}
function pick(arr){return arr[Math.floor(rand()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function round1(v){return Math.round(v*10)/10;}

const FIRST=["Amara","Liam","Noor","Ethan","Priya","Marcus","Sofia","Devon","Renee","Kwame","Elena","Jacob","Mei","Oscar","Fatima","Caleb","Ines","Tariq","Naomi","Felix","Ava","Hassan","Bianca","Theo","Layla","Simon","Chidi","Grace","Rafael","Yuki","Nadia","Owen","Zara","Milo","Ingrid","Andre","Priscilla","Malik","Clara","Deshawn","Aisha","Rowan","Camille","Julian","Whitney","Sana","Toby","Leilani","Gabriel","Nina","Otis","Farah","Beckett","Rina","Cyrus","Mabel","Kai","Odalys","Trent","Amina"];
const LAST=["Okafor","Reyes","Chen","Bennett","Alvarez","Webb","Nandakumar","Clarke","Ferreira","Osei","Kowalski","Marsh","Delgado","Nakamura","Haddad","Fontaine","Barrett","Diallo","Whitfield","Sokolova","Mercer","Abara","Lindqvist","Duarte","Kimura","Solis","Odom","Prescott","Farrow","Uchida","Novak","Mbeki","Castellano","Reyneke","Aoki","Vance","Achebe","Halvorsen","Petit","Sarpong"];
function fullName(used){let n;do{n=pick(FIRST)+" "+pick(LAST);}while(used.has(n));used.add(n);return n;}
const usedNames=new Set();

const LOCATIONS=["Austin, TX","Denver, CO","New York, NY","Remote — US","Los Angeles, CA","Charlotte, NC"];
const DEPTS=[
  {id:'eng',name:'Engineering',target:112},
  {id:'content',name:'Content Production',target:68},
  {id:'cx',name:'Customer Experience',target:64},
  {id:'sales',name:'Ad Sales',target:54},
  {id:'product',name:'Product',target:40},
  {id:'marketing',name:'Marketing',target:34},
  {id:'data',name:'Data & Analytics',target:29},
  {id:'ga',name:'G&A (Finance, Legal, People)',target:26},
];
const DEPT_COLOR={eng:'--cat-1',content:'--cat-2',cx:'--cat-3',sales:'--cat-4',product:'--cat-5',marketing:'--cat-6',data:'--cat-7',ga:'--cat-8'};
function cssv(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function deptColor(id){return cssv(DEPT_COLOR[id]);}

const HRBPS=[
  {id:'hrbp1',name:'Priya Nandakumar',title:'Sr. HR Business Partner',depts:['eng']},
  {id:'hrbp2',name:'Marcus Webb',title:'HR Business Partner',depts:['content','data']},
  {id:'hrbp3',name:'Sofia Alvarez',title:'HR Business Partner',depts:['cx']},
  {id:'hrbp4',name:'Devon Clarke',title:'Sr. HR Business Partner',depts:['sales','marketing']},
  {id:'hrbp5',name:'Renee Okafor',title:'HR Business Partner',depts:['product','ga']},
];
function hrbpForDept(deptId){return HRBPS.find(h=>h.depts.includes(deptId));}

const TITLES_IC={
  eng:['Software Engineer I','Software Engineer II','Senior Software Engineer','Staff Engineer','QA Engineer','DevOps Engineer'],
  content:['Production Associate','Producer','Senior Producer','Video Editor','Broadcast Technician','Content Strategist'],
  cx:['Support Specialist','Sr. Support Specialist','Customer Success Manager','CX Operations Analyst'],
  sales:['Account Executive','Sr. Account Executive','Ad Sales Coordinator','Partnerships Manager'],
  product:['Product Manager','Sr. Product Manager','Product Analyst','UX Designer'],
  marketing:['Marketing Specialist','Growth Marketing Manager','Brand Designer','Lifecycle Marketing Manager'],
  data:['Data Analyst','Sr. Data Analyst','Analytics Engineer','BI Developer'],
  ga:['Financial Analyst','Staff Accountant','People Ops Coordinator','Legal Counsel','Recruiter'],
};

let empSeq=1000;
const managers=[]; // {id,name,title,deptId,hrbpId,level:'M1'|'M2',reports:[empId]}
const employees=[]; // active roster

function makeEmployee(deptId, managerId, opts){
  opts=opts||{};
  const id='E'+(empSeq++);
  const tenureMonths=opts.tenureMonths!=null?opts.tenureMonths:ri(2,74);
  const hire=new Date(); hire.setMonth(hire.getMonth()-tenureMonths);
  // performance calibration: skewed distribution
  const roll=rand();
  let band, num;
  if(roll<0.06){band='Far Exceeds'; num=rf(4.6,5.0);}
  else if(roll<0.27){band='Exceeds'; num=rf(4.0,4.55);}
  else if(roll<0.80){band='Meets'; num=rf(3.15,3.95);}
  else if(roll<0.94){band='Below'; num=rf(2.3,3.1);}
  else {band='Significantly Below'; num=rf(1.3,2.25);}
  num=round1(num);
  const perfTrendDelta=round1(rf(-0.5,0.5));
  const level=opts.level||pick(['IC1','IC2','IC2','IC3','IC3','IC3','IC4','IC5']);
  const title=opts.title||pick(TITLES_IC[deptId]);
  // engagement baseline
  const deptBase={eng:74,content:71,cx:66,sales:70,product:76,marketing:73,data:75,ga:72}[deptId];
  let engagement=clamp(Math.round(deptBase+rf(-16,14)-(num<2.8?8:0)),22,98);
  // attrition risk heuristic
  let risk=0;
  risk+=(100-engagement)*0.42;
  risk+=num<3.0?22:(num<3.4?9:0);
  risk+=tenureMonths>10 && tenureMonths<26 ? 8:0; // mid-tenure flight risk window
  risk+=perfTrendDelta<-0.2?10:0;
  risk+=rf(-8,8);
  risk=clamp(Math.round(risk),3,97);
  const potential=clamp(Math.round(engagement*0.42 + (num/5*100)*0.33 + rf(-16,16)),4,99);
  const emp={
    id, name:fullName(usedNames), title, level, deptId, managerId,
    hrbpId: hrbpForDept(deptId).id, location:pick(LOCATIONS),
    hireDate:hire.toISOString().slice(0,10), tenureMonths,
    perf:num, perfBand:band, perfTrendDelta,
    engagement, engagementTrendDelta:round1(rf(-9,6)),
    attritionRisk:risk,
    riskBand: risk>=65?'High':(risk>=40?'Elevated':'Low'),
    potential,
  };
  employees.push(emp);
  return emp;
}
function perfBand9(perf){ return perf>=4.0?'High':(perf>=3.0?'Medium':'Low'); }
function potentialBand9(pot){ return pot>=70?'High':(pot>=40?'Medium':'Low'); }

DEPTS.forEach(dept=>{
  const hrbp=hrbpForDept(dept.id);
  const directorId='E'+(empSeq++);
  const director={
    id:directorId, name:fullName(usedNames), title:'Director, '+dept.name, level:'M2', deptId:dept.id,
    managerId:null, hrbpId:hrbp.id, location:pick(LOCATIONS), hireDate:'2020-01-01', tenureMonths:ri(30,72),
    perf:round1(rf(3.6,4.7)), perfBand:'Exceeds', perfTrendDelta:round1(rf(-0.2,0.4)),
    engagement:ri(70,92), engagementTrendDelta:round1(rf(-4,5)), attritionRisk:ri(5,22), riskBand:'Low',
    isDirector:true, potential:ri(55,95),
  };
  employees.push(director);
  let remaining=dept.target;
  const mgrList=[];
  while(remaining>0){
    const teamSize=Math.min(remaining, ri(6,11));
    const mgrId='E'+(empSeq++);
    const mgrTenure=ri(8,60);
    const mgrHire=new Date(); mgrHire.setMonth(mgrHire.getMonth()-mgrTenure);
    const mgrPerf=round1(rf(3.2,4.6));
    const mgr={
      id:mgrId, name:fullName(usedNames), title:'Manager, '+dept.name, level:'M1', deptId:dept.id,
      managerId:directorId, hrbpId:hrbp.id, location:pick(LOCATIONS), hireDate:mgrHire.toISOString().slice(0,10),
      tenureMonths:mgrTenure, perf:mgrPerf, perfBand: mgrPerf>4?'Exceeds':'Meets', perfTrendDelta:round1(rf(-0.3,0.3)),
      engagement:ri(58,90), engagementTrendDelta:round1(rf(-6,5)), attritionRisk:ri(6,45), riskBand:'Low',
      isManager:true, teamSize, potential:ri(30,95),
    };
    // risk band recompute
    mgr.riskBand=mgr.attritionRisk>=65?'High':(mgr.attritionRisk>=40?'Elevated':'Low');
    employees.push(mgr);
    managers.push(mgr);
    mgrList.push(mgr);
    for(let i=0;i<teamSize;i++) makeEmployee(dept.id, mgrId);
    remaining-=teamSize;
  }
  dept.directorId=directorId;
  dept.managerIds=mgrList.map(m=>m.id);
});

const empById={}; employees.forEach(e=>empById[e.id]=e);
const managersFull=employees.filter(e=>e.isManager);
const TOTAL_HC=employees.length;

/* ---- company & dept monthly time series (engagement, attrition rate) ---- */
const MONTHS=(()=>{const arr=[];const d=new Date();d.setDate(1);for(let i=11;i>=0;i--){const m=new Date(d);m.setMonth(m.getMonth()-i);arr.push(m.toLocaleString('en-US',{month:'short'}));}return arr;})();
function buildSeries(base, volatility, dipAt, dipMag){
  const s=[]; let v=base;
  for(let i=0;i<12;i++){
    v+=rf(-volatility,volatility*0.8);
    let val=v;
    if(dipAt!=null){ const dist=Math.abs(i-dipAt); val -= dipMag*Math.max(0,1-dist/2.2); }
    s.push(clamp(round1(val),0,100));
  }
  return s;
}
const REORG_MONTH=7;
const companyEngagementSeries=buildSeries(74,1.6,REORG_MONTH,9);
const companyAttritionSeries=(()=>{const s=[];let v=1.05;for(let i=0;i<12;i++){v+=rf(-0.12,0.12); let val=v+(i>=REORG_MONTH&&i<=REORG_MONTH+2?0.55:0); s.push(clamp(round1(val),0.3,3.2));}return s;})();
const deptEngagementSeries={}; const deptAttritionSeries={};
DEPTS.forEach(d=>{
  const base={eng:74,content:71,cx:66,sales:70,product:76,marketing:73,data:75,ga:72}[d.id];
  deptEngagementSeries[d.id]=buildSeries(base,2.2, d.id==='cx'?REORG_MONTH:null, d.id==='cx'?14:6);
  deptAttritionSeries[d.id]=(()=>{const s=[];let v=rf(0.7,1.3);for(let i=0;i<12;i++){v+=rf(-0.18,0.18); s.push(clamp(round1(v),0.2,4.2));}return s;})();
});
managersFull.forEach(m=>{
  const rel=m.attritionRisk/100;
  const s=[]; let v=0.6+rel*2.2;
  for(let i=0;i<6;i++){ v+=rf(-0.3,0.3); s.push(clamp(round1(v),0.1,6));}
  m.attritionSpark=s;
  m.attritionRate12mo=round1(s[s.length-1]*1.05);
  const eng=[]; let ev=m.engagement;
  for(let i=0;i<6;i++){ ev+=rf(-3,2.4); eng.push(clamp(Math.round(ev),15,99));}
  m.engagementSpark=eng;
});

/* ---- org-diagnostic proxies: span of control, workload pressure, decision latency ---- */
const companySpans=managersFull.map(m=>m.teamSize);
const companyMedianSpan=companySpans.slice().sort((a,b)=>a-b)[Math.floor(companySpans.length/2)];
managersFull.forEach(m=>{
  m.spanOfControl=m.teamSize;
  m.workloadPressureProxy=clamp(Math.round((m.teamSize/companyMedianSpan)*46 + (100-m.engagement)*0.32 + rf(-6,6)),4,99);
  m.decisionLatencyProxy=clamp(Math.round(m.teamSize*2.1 + (24-Math.min(m.tenureMonths,24))*1.15 + rf(-8,8)),4,99);
});
const companyManagementDensity=round1(managersFull.length/TOTAL_HC*100);

/* ================================================================
   1B. EXIT INTERVIEWS (simulated, de-identified) & ER CASE TRACKER
   ================================================================ */
const EXIT_REASONS=[
  {cat:'Compensation', quotes:['Received an offer that was meaningfully higher for similar scope.','Felt base pay had fallen behind market for this role.']},
  {cat:'Career growth', quotes:['Didn’t see a clear next step here in the next year or two.','Wanted broader scope than this seat could offer right now.']},
  {cat:'Manager relationship', quotes:['Communication with my manager felt inconsistent.','Wanted more regular coaching and feedback than I was getting.']},
  {cat:'Work-life balance', quotes:['Workload had been unsustainable for a few quarters.','Needed a schedule that fit a change in personal circumstances.']},
  {cat:'Relocation', quotes:['Moving for a partner’s job.','Relocating closer to family.']},
  {cat:'Better opportunity', quotes:['The new role was a step up in scope and title.','It was a hard offer to turn down.']},
  {cat:'Team culture', quotes:['Team dynamics had gotten harder over the last year.','Didn’t feel like I fully belonged on this team.']},
  {cat:'Health / personal', quotes:['Stepping back for personal health reasons.','Family circumstances required a change.']},
];
const EXIT_RECORDS=(()=>{
  const n=64, out=[];
  for(let i=0;i<n;i++){
    const dept=pick(DEPTS);
    const mgrPool=managersFull.filter(m=>m.deptId===dept.id);
    const mgr=mgrPool.length?pick(mgrPool):pick(managersFull);
    const reason=pick(EXIT_REASONS);
    const monthsAgo=ri(0,11);
    const d=new Date(); d.setMonth(d.getMonth()-monthsAgo);
    const sentiment=clamp(Math.round(rf(28,92)),5,99);
    out.push({
      id:'X'+(i+1), deptId:dept.id, managerId:mgr.id, title:pick(TITLES_IC[dept.id]),
      exitDate:d.toISOString().slice(0,10), monthsAgo, tenureMonths:ri(4,58),
      reason:reason.cat, quote:pick(reason.quotes),
      sentiment, wouldRecommend: sentiment>=65?'Yes':(sentiment>=42?'Maybe':'No'),
    });
  }
  return out;
})();

const ER_CATEGORIES=[
  {cat:'Policy violation', slaDays:10},
  {cat:'Interpersonal conflict', slaDays:15},
  {cat:'Harassment complaint', slaDays:5},
  {cat:'Performance dispute', slaDays:20},
  {cat:'Discrimination concern', slaDays:5},
  {cat:'Retaliation concern', slaDays:5},
  {cat:'Wage / hour question', slaDays:10},
];
const ER_THEMES=['Workload','Communication','Scheduling','Compensation perception','Role clarity','Team dynamics'];
const SOP_STEPS=['Intake acknowledged','Investigation started','Interviews completed','Resolution documented','Case closed'];
const ER_CASES=(()=>{
  const n=22, out=[]; const today=new Date();
  for(let i=0;i<n;i++){
    const c=pick(ER_CATEGORIES);
    const openedDaysAgo=ri(1,55);
    const opened=new Date(today); opened.setDate(opened.getDate()-openedDaysAgo);
    const due=new Date(opened); due.setDate(due.getDate()+c.slaDays);
    const daysRemaining=Math.round((due-today)/86400000);
    const closedRoll=rand();
    const stage= closedRoll<0.4?'Closed' : (daysRemaining<0?'Investigation': pick(['Intake','Investigation','Resolution']));
    let status;
    if(stage==='Closed') status='Closed';
    else if(daysRemaining<0) status='Breached';
    else if(daysRemaining<=3) status='At risk';
    else status='On track';
    const stepIdx=SOP_STEPS.indexOf('Intake acknowledged')+(stage==='Closed'?5:(stage==='Resolution'?3:(stage==='Investigation'?2:1)));
    out.push({
      id:'ER-'+(2000+i), category:c.cat, deptId:(()=>{const d=pick(DEPTS);return d.id;})(), theme:pick(ER_THEMES),
      openedDate:opened.toISOString().slice(0,10), dueDate:due.toISOString().slice(0,10),
      daysRemaining, stage, status, ownerId:pick(HRBPS).id,
      sopMilestones:SOP_STEPS.map((s,idx)=>({name:s, done:idx<Math.min(stepIdx,5)})),
    });
  }
  return out;
})();

/* ================================================================
   2. AGGREGATIONS
   ================================================================ */
function avg(arr){return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : 0;}
function deptEmployees(id){return employees.filter(e=>e.deptId===id && !e.isDirector && !e.isManager);}
function deptAllStaff(id){return employees.filter(e=>e.deptId===id);}
const deptAgg=DEPTS.map(d=>{
  const staff=deptAllStaff(d.id);
  return {
    ...d, color:deptColor(d.id), headcount:staff.length,
    avgPerf:round1(avg(staff.map(e=>e.perf))),
    avgEngagement:Math.round(avg(staff.map(e=>e.engagement))),
    highRisk:staff.filter(e=>e.riskBand==='High').length,
    elevatedRisk:staff.filter(e=>e.riskBand==='Elevated').length,
    attritionRate: deptAttritionSeries[d.id][11]*4, // annualized-ish estimate from latest monthly
  };
});
const companyAvgPerf=round1(avg(employees.map(e=>e.perf)));
const companyAvgEngagement=Math.round(avg(employees.map(e=>e.engagement)));
const companyHighRisk=employees.filter(e=>e.riskBand==='High').length;
const companyElevated=employees.filter(e=>e.riskBand==='Elevated').length;
const companyAttritionRate=round1(companyAttritionSeries[11]*4);
const companyAttritionRatePrev=round1(companyAttritionSeries[8]*4);
const perfBandCounts=['Far Exceeds','Exceeds','Meets','Below','Significantly Below'].map(b=>({band:b,count:employees.filter(e=>e.perfBand===b).length}));

/* ---- competency & bench-strength mapping (Workforce Planner: HR + C-suite) ---- */
const COMPETENCIES=['Technical depth','Leadership & coaching','Domain expertise','Cross-functional collaboration','Data fluency'];
const COMPETENCY_BIAS={
  eng:[1.1,0.75,0.9,0.8,1.0], content:[0.7,0.85,1.1,0.95,0.7], cx:[0.7,0.9,0.95,1.05,0.75],
  sales:[0.65,0.85,1.05,1.1,0.8], product:[0.9,0.9,1.0,1.05,0.95], marketing:[0.7,0.8,0.95,1.0,0.9],
  data:[1.05,0.75,0.9,0.85,1.15], ga:[0.75,0.85,1.0,0.9,0.8],
};
const competencyMatrix=DEPTS.map(d=>({
  deptId:d.id, name:d.name,
  scores:COMPETENCIES.map((c,i)=>clamp(round1(2.6*COMPETENCY_BIAS[d.id][i]+rf(-0.4,0.4)),1,5)),
}));
function benchStrengthByDept(){
  return DEPTS.map(d=>{
    const mgrs=managersFull.filter(m=>m.deptId===d.id);
    const covered=mgrs.filter(m=>successionCandidates(m).some(c=>c.readiness!=='Development needed')).length;
    return {deptId:d.id, name:d.name, roles:mgrs.length, covered, pct: mgrs.length?round1(covered/mgrs.length*100):100};
  });
}

/* ---- per-employee competencies, LMS completion & leveling (feeds promotion readiness) ---- */
employees.forEach(e=>{
  e.competencyScores=COMPETENCIES.map((c,i)=>clamp(round1(2.3*COMPETENCY_BIAS[e.deptId][i]*(0.7+0.3*e.perf/5)+rf(-0.5,0.5)),1,5));
  e.lmsCompletionPct=clamp(Math.round(50+e.engagement*0.4+rf(-15,15)),10,100);
});
function avgCompetency(e){ return round1(avg(e.competencyScores)); }
const LEVELS=[
  {id:'IC1', title:'Associate', minCompetency:1.6, minLms:40, blurb:'Learning core workflows under close guidance.'},
  {id:'IC2', title:'Contributor', minCompetency:2.1, minLms:55, blurb:'Executes independently on well-defined work.'},
  {id:'IC3', title:'Senior Contributor', minCompetency:2.7, minLms:65, blurb:'Owns projects end-to-end; mentors newer teammates.'},
  {id:'IC4', title:'Staff', minCompetency:3.4, minLms:75, blurb:'Sets technical or functional direction across a team.'},
  {id:'IC5', title:'Principal', minCompetency:4.1, minLms:85, blurb:'Shapes strategy across multiple teams or the org.'},
];
function levelInfo(id){ return LEVELS.find(l=>l.id===id); }
function nextLevel(id){ const i=LEVELS.findIndex(l=>l.id===id); return i>=0 && i<LEVELS.length-1 ? LEVELS[i+1] : null; }
function promotionReadiness(e){
  const next=nextLevel(e.level);
  if(!next) return {status:'At top tracked level', next:null, compGap:0, lmsGap:0};
  const compGap=round1(Math.max(0,next.minCompetency-avgCompetency(e)));
  const lmsGap=Math.max(0,next.minLms-e.lmsCompletionPct);
  const perfOk=e.perf>=3.8;
  let status;
  if(compGap<=0 && lmsGap<=0 && perfOk) status='Ready now';
  else if(compGap<=0.4 && lmsGap<=15) status='Ready 1–2 cycles';
  else status='Developing';
  return {status, next, compGap, lmsGap};
}

/* ---- comp & benefits analyzer: internal pay vs. simulated industry benchmark, headcount budget ---- */
const SALARY_MIDPOINT={IC1:65000,IC2:80000,IC3:100000,IC4:130000,IC5:165000,M1:112000,M2:148000,M3:190000};
const DEPT_COMP_MULT={eng:1.15,data:1.12,product:1.08,sales:1.02,marketing:0.95,content:0.92,cx:0.86,ga:0.9};
const MARKET_MIDPOINT={}; Object.keys(SALARY_MIDPOINT).forEach(l=>{ MARKET_MIDPOINT[l]=Math.round(SALARY_MIDPOINT[l]*rf(1.01,1.07)/50)*50; });
employees.forEach(e=>{
  const mult=DEPT_COMP_MULT[e.deptId]||1;
  e.baseSalary=Math.round(SALARY_MIDPOINT[e.level]*mult*rf(0.87,1.13)/500)*500;
});
function marketRate(e){ return Math.round(MARKET_MIDPOINT[e.level]*(DEPT_COMP_MULT[e.deptId]||1)); }
function compaRatio(e){ return round1(e.baseSalary/marketRate(e)); }
const DEPT_BUDGET_VARIANCE={eng:-6,content:4,cx:3,sales:-3,product:2,marketing:1,data:-2,ga:2};
function headcountBudget(deptId){
  const actual=deptAllStaff(deptId).length;
  const budgeted=actual+(DEPT_BUDGET_VARIANCE[deptId]||0);
  return {budgeted, actual, variance:actual-budgeted};
}
function compRisksAndActions(scopeDeptIds){
  const out=[];
  scopeDeptIds.forEach(id=>{
    const dept=DEPTS.find(d=>d.id===id);
    const staff=deptAllStaff(id);
    const avgCompa=round1(avg(staff.map(compaRatio)));
    const belowMarketHighPerf=staff.filter(e=>compaRatio(e)<0.9 && e.perf>=4.0);
    const budget=headcountBudget(id);
    if(avgCompa<0.92){
      out.push({dept:dept.name,type:'Pay-equity risk',severity:'High',
        text:`${dept.name} runs ${Math.round((1-avgCompa)*100)}% below the simulated market rate on average across ${staff.length} roles.`,
        action:`Scope an off-cycle market adjustment for ${dept.name}, prioritizing the ${belowMarketHighPerf.length} high performers flagged below market.`});
    } else if(belowMarketHighPerf.length>=3){
      out.push({dept:dept.name,type:'Retention risk',severity:'Medium',
        text:`${belowMarketHighPerf.length} high performers in ${dept.name} are paid below the simulated market rate (compa-ratio &lt; 0.90).`,
        action:`Review individual comp for these ${belowMarketHighPerf.length} employees ahead of the next cycle.`});
    }
    if(budget.variance>4){
      out.push({dept:dept.name,type:'Budget risk',severity:'Medium',
        text:`${dept.name} is running ${budget.variance} headcount over the simulated budget (${budget.actual} actual vs. ${budget.budgeted} budgeted).`,
        action:`Flag to Finance for the next headcount review; confirm whether backfills are pre-approved.`});
    } else if(budget.variance<-4){
      out.push({dept:dept.name,type:'Capacity risk',severity:'Low',
        text:`${dept.name} is running ${Math.abs(budget.variance)} headcount under the simulated budget (${budget.actual} actual vs. ${budget.budgeted} budgeted).`,
        action:`Confirm with the department leader whether open budget should convert to active requisitions.`});
    }
  });
  const order={High:0,Medium:1,Low:2};
  return out.sort((a,b)=>order[a.severity]-order[b.severity]);
}

function managerAgg(mgr){
  const team=employees.filter(e=>e.managerId===mgr.id);
  return {
    mgr, team, headcount:team.length,
    avgPerf:round1(avg(team.map(e=>e.perf))||mgr.perf),
    avgEngagement:Math.round(avg(team.map(e=>e.engagement))||mgr.engagement),
    highRisk:team.filter(e=>e.riskBand==='High').length,
    elevatedRisk:team.filter(e=>e.riskBand==='Elevated').length,
  };
}

/* coaching suggestions engine (HRBP view) */
function coachingSuggestions(scopeDeptIds){
  const mgrs=managersFull.filter(m=>scopeDeptIds.includes(m.deptId));
  const out=[];
  mgrs.forEach(m=>{
    const agg=managerAgg(m);
    const engDelta=m.engagementSpark[m.engagementSpark.length-1]-m.engagementSpark[0];
    if(agg.highRisk>=2){
      out.push({mgr:m,priority:'High',type:'Retention focus',
        text:`${agg.highRisk} direct reports are flagged high attrition risk (avg engagement ${agg.avgEngagement}). Recommend stay interviews within 2 weeks and a workload/comp review for the team.`});
    }
    if(engDelta<=-10){
      out.push({mgr:m,priority:'High',type:'Engagement dip',
        text:`Team engagement dropped ${Math.abs(Math.round(engDelta))} pts over the last 6 pulses. Suggest a listening session and reviewing recent workload or org changes with ${m.name.split(' ')[0]}.`});
    }
    if(m.tenureMonths<7 && agg.headcount>=6){
      out.push({mgr:m,priority:'Medium',type:'New-manager support',
        text:`${m.name} became a people manager ${m.tenureMonths} months ago with a ${agg.headcount}-person team. Recommend enrolling in the new-manager coaching cohort and pairing with a peer mentor.`});
    }
    if(agg.avgPerf<3.1){
      out.push({mgr:m,priority:'Medium',type:'Calibration coaching',
        text:`Team average performance (${agg.avgPerf}) trails the company benchmark (${companyAvgPerf}). Review calibration notes with ${m.name.split(' ')[0]} ahead of the next cycle.`});
    }
  });
  const order={High:0,Medium:1,Low:2};
  return out.sort((a,b)=>order[a.priority]-order[b.priority]);
}

/* workflow amplifier suggestions (manager view, "you" scoped) */
function amplifierTasks(mgr){
  const agg=managerAgg(mgr);
  const tasks=[];
  agg.team.filter(e=>e.riskBand!=='Low').sort((a,b)=>b.attritionRisk-a.attritionRisk).slice(0,4).forEach(e=>{
    tasks.push({icon:'⚡',title:`Schedule a check-in with ${e.name}`,
      desc:`${e.riskBand} attrition risk (score ${e.attritionRisk}) · engagement ${e.engagement} · ${e.title}`,
      badge:e.riskBand==='High'?'High priority':'Elevated'});
  });
  if(agg.avgEngagement < companyAvgEngagement-6){
    tasks.push({icon:'📣',title:'Run a team pulse follow-up',desc:`Team engagement (${agg.avgEngagement}) is below the company average (${companyAvgEngagement}). A short listening session can surface the driver before the next survey.`,badge:'Suggested'});
  }
  const lowRecent=agg.team.filter(e=>e.perfTrendDelta<-0.25);
  if(lowRecent.length){
    tasks.push({icon:'📈',title:'Review recent performance trend',desc:`${lowRecent.length} team member${lowRecent.length>1?'s':''} trending down since last cycle: ${lowRecent.slice(0,3).map(e=>e.name).join(', ')}.`,badge:'Suggested'});
  }
  tasks.push({icon:'🗓️',title:'Prep for HRBP sync',desc:`Your HRBP ${HRBPS.find(h=>h.id===mgr.hrbpId).name} will review your team's benchmark this week — export a report to bring talking points.`,badge:'Reminder'});
  return tasks;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function riskPill(band, score){
  const cls=band==='High'?'critical':(band==='Elevated'?'warning':'good');
  return `<span class="pill ${cls}"><span class="pdot"></span>${band}${score!=null?` · ${score}`:''}</span>`;
}
function perfPill(band){
  const map={'Far Exceeds':'good','Exceeds':'good','Meets':'neutral','Below':'warning','Significantly Below':'critical'};
  return `<span class="pill ${map[band]}">${band}</span>`;
}
function deltaEl(delta,{goodIsUp=true,suffix='',label='vs prior',flatLabel='flat'}={}){
  delta=round1(delta);
  if(Math.abs(delta)<0.05) return `<span class="delta flat">— ${flatLabel}</span>`;
  const up=delta>0;
  const good=goodIsUp?up:!up;
  const arrow=up?'▲':'▼';
  return `<span class="delta ${good?'up-good':'up-bad'}">${arrow} ${Math.abs(delta)}${suffix} ${label}</span>`;
}
function barCell(value,max,color){
  const pct=clamp(value/max*100,0,100);
  return `<div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="tabular" style="min-width:30px">${value}</span></div>`;
}

}

      <div id="main"></div>
    </div>
  </div>`;

  document.querySelectorAll('.persona-btn').forEach(b=>b.addEventListener('click',()=>{
    state.role=b.dataset.role; state.section=SECTIONS[state.role][0][0]; renderAll(); closeRail();
  }));

function renderPersonaContext(){
  const el=document.getElementById('persona-context');
  if(state.role==='manager'){
    const opts=managersFull.map(m=>`<option value="${m.id}" ${m.id===state.asManagerId?'selected':''}>${esc(m.name)} — ${DEPTS.find(d=>d.id===m.deptId).name}</option>`).join('');
    el.innerHTML=`Acting as manager<select id="sel-manager">${opts}</select>`;
    document.getElementById('sel-manager').addEventListener('change',e=>{state.asManagerId=e.target.value; renderAll();});
  } else if(state.role==='hrbp'){
    const opts=HRBPS.map(h=>`<option value="${h.id}" ${h.id===state.asHrbpId?'selected':''}>${esc(h.name)}</option>`).join('');
    el.innerHTML=`Acting as HRBP<select id="sel-hrbp">${opts}</select>`;
    document.getElementById('sel-hrbp').addEventListener('change',e=>{state.asHrbpId=e.target.value; renderAll();});
  } else {
    el.innerHTML=`People Team<br><span class="subtle">Company-wide visibility · ${TOTAL_HC.toLocaleString()} employees</span>`;
  }
}

function renderNav(){
  const nav=document.getElementById('section-nav');
  nav.innerHTML=SECTIONS[state.role].map(([id,label])=>`
    <button class="nav-item ${state.section===id?'active':''}" data-sec="${id}">${railIcon(id)}${label}</button>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{state.section=b.dataset.sec; renderAll(); closeRail();}));
}

function topbarTitle(){
  if(state.role==='manager'){const m=currentManager();return [`Team overview — ${m.name}`, `${DEPTS.find(d=>d.id===m.deptId).name} · ${managerAgg(m).headcount} direct reports`];}
  if(state.role==='hrbp'){const h=currentHrbp();return [`${h.name}'s client groups`, h.depts.map(d=>DEPTS.find(x=>x.id===d).name).join(' · ')];}
  return ['Company-wide people analytics', `${TOTAL_HC.toLocaleString()} employees across ${DEPTS.length} departments`];
}

function renderTopbar(){
  const [title,sub]=topbarTitle();
  const tb=document.getElementById('topbar');
  tb.innerHTML=`
    <div class="topbar-main">
      <button class="rail-toggle" id="rail-toggle" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div>
    </div>
    <div class="topbar-actions">
      <select class="range-select" id="range-select">
        <option value="3" ${state.range==3?'selected':''}>Last 3 months</option>
        <option value="6" ${state.range==6?'selected':''}>Last 6 months</option>
        <option value="12" ${state.range==12?'selected':''}>Last 12 months</option>
      </select>
      <button class="btn ask" id="ask-btn">✨ Ask Tap In</button>
    </div>`;
  document.getElementById('range-select').addEventListener('change',e=>{state.range=+e.target.value; renderAll();});
  document.getElementById('ask-btn').addEventListener('click',openAssistant);
  document.getElementById('rail-toggle').addEventListener('click',openRail);
}
function openRail(){ document.getElementById('rail').classList.add('open'); document.getElementById('rail-backdrop').classList.add('open'); }
function closeRail(){ document.getElementById('rail').classList.remove('open'); document.getElementById('rail-backdrop').classList.remove('open'); }

/* ================================================================

   ================================================================ */
function renderAll(){
  destroyCharts();
  renderPersonaContext();
  renderNav();
  renderTopbar();
  const main=document.getElementById('main');
  const key=state.role+':'+state.section;
  const fn=SECTION_RENDERERS[key]||(()=>`<div class="empty-note">Coming soon.</div>`);
  main.innerHTML=fn();
  wireSectionInteractions();
  updateAssistScopeLabel();
}

}

async function runHrbpAgent(){
  if(state.agentBusy) return;
  const hrbp=currentHrbp();
  state.agentBusy=true; renderAll();
  try{
    const sample=await claude.use('sample');
    if(!sample){
      state.agentRuns[hrbp.id]={generatedAt:new Date().toLocaleString(), priorities:[{title:'AI assistant isn’t available in this preview context.',rationale:''}], managerActions:[], draftMessages:[], stayInterviews:[]};
      return;
    }
    const sys=`You are the Tap In HRBP Automation Agent, running autonomously for ${hrbp.name}, HR Business Partner for: ${hrbpDepts().map(d=>DEPTS.find(x=>x.id===d).name).join(', ')}. `+
      `Use the provided tools to pull real figures before writing anything — never invent numbers. All data is simulated demo data, not a real company.\n\n`+
      `Produce a JSON object with EXACTLY these keys and nothing else:\n`+
      `{"priorities":[{"title":string,"rationale":string}], // exactly 3, most urgent first\n`+
      ` "managerActions":[{"manager":string,"action":string,"priority":"High"|"Medium"}], // up to 5 concrete next steps for specific managers\n`+
      ` "stayInterviews":[{"employee":string,"reason":string}], // up to 4 highest attrition-risk people worth a proactive conversation\n`+
      ` "draftMessages":[{"channel":"Email"|"Slack","to":string,"subject":string,"body":string}]} // exactly 2 ready-to-send drafts: one coaching nudge to a manager, one stay-interview invite to an employee\n\n`+
      `Return ONLY the JSON object.`;
    const result=await sample.json(sys,{tools:AI_TOOLS, modelTier:'default'});
    state.agentRuns[hrbp.id]={...result, generatedAt:new Date().toLocaleString()};
  }catch(err){
    state.agentRuns[hrbp.id]={generatedAt:new Date().toLocaleString(), priorities:[{title:'The agent run failed.',rationale:(err&&err.message)?err.message:'Unknown error.'}], managerActions:[], draftMessages:[], stayInterviews:[]};
  }finally{
    state.agentBusy=false; renderAll();
  }
}

/* ---------- shared: Exec report ---------- */
function buildExecReport(scopeLabel, staff, mgrsInScope, extra){
  const avgEng=Math.round(avg(staff.map(e=>e.engagement)));
  const avgPerf=round1(avg(staff.map(e=>e.perf)));
  const high=staff.filter(e=>e.riskBand==='High');
  const lines=[];
  lines.push(`TAP IN — EXECUTIVE SUMMARY`);
  lines.push(`Scope: ${scopeLabel}`);
  lines.push(`Generated: ${new Date().toISOString().slice(0,10)}  ·  Period: trailing ${state.range} months`);
  lines.push('='.repeat(60));
  lines.push('');
  lines.push(`HEADCOUNT           ${staff.length}`);
  lines.push(`AVG PERFORMANCE     ${avgPerf} / 5.0  (company: ${companyAvgPerf})`);
  lines.push(`AVG ENGAGEMENT      ${avgEng} / 100  (company: ${companyAvgEngagement})`);
  lines.push(`ATTRITION (annualized est.)   ${extra&&extra.attritionRate!=null?extra.attritionRate:companyAttritionRate}%  (prior period: ${companyAttritionRatePrev}%)`);
  lines.push(`HIGH ATTRITION-RISK HEADCOUNT   ${high.length}`);
  lines.push('');
  lines.push(`TOP ATTRITION-RISK HOTSPOTS`);
  lines.push('-'.repeat(60));
  high.sort((a,b)=>b.attritionRisk-a.attritionRisk).slice(0,8).forEach(e=>{
    lines.push(`  ${e.name.padEnd(24)} ${e.title.padEnd(26)} risk ${e.attritionRisk}`);
  });
  if(!high.length) lines.push('  None flagged in this scope.');
  lines.push('');
  if(mgrsInScope && mgrsInScope.length){
    lines.push(`MANAGER COACHING RECOMMENDATIONS`);
    lines.push('-'.repeat(60));
    const sug=coachingSuggestions(mgrsInScope.map(m=>m.deptId).filter((v,i,a)=>a.indexOf(v)===i)).filter(s=>mgrsInScope.includes(s.mgr));
    if(sug.length){ sug.slice(0,6).forEach(s=>lines.push(`  [${s.priority}] ${s.mgr.name} — ${s.type}: ${s.text}`)); }
    else lines.push('  No active coaching flags.');
    lines.push('');
  }
  lines.push(`PERFORMANCE DISTRIBUTION (company-wide)`);
  lines.push('-'.repeat(60));
  perfBandCounts.forEach(p=>lines.push(`  ${p.band.padEnd(22)} ${p.count} (${round1(p.count/TOTAL_HC*100)}%)`));
  lines.push('');
  lines.push(`Prepared by Tap In — AI-driven and agentic people analytics and workflow amplifier.`);
  lines.push(`This report uses simulated demo data and is not connected to a live HRIS.`);
  return lines.join('\n');
}

function ninebox(grid,total){
  const rows=['High','Medium','Low'];
  const cols=['Low','Medium','High'];
  const labels={'High|High':'Star talent','High|Medium':'High performer','High|Low':'Consistent performer',
    'Medium|High':'High potential','Medium|Medium':'Core performer','Medium|Low':'Steady contributor',
    'Low|High':'Diamond in the rough','Low|Medium':'Inconsistent','Low|Low':'Needs support'};
  return `<div class="ninebox-grid">
    <div class="ninebox-axis-y">Performance →</div>
    ${rows.map(p=>cols.map(q=>{
      const n=grid[p+'|'+q]||0; const pct=total?round1(n/total*100):0;
      const tier=(p==='High'&&q==='High')?'good':((p==='Low'&&q==='Low')?'critical':'neutral');
      return `<div class="ninebox-cell tier-${tier}">
        <div class="ninebox-n">${n}</div>
        <div class="ninebox-label">${labels[p+'|'+q]}</div>
        <div class="ninebox-pct">${pct}%</div>
      </div>`;
    }).join('')).join('')}
    <div class="ninebox-axis-x">Potential →</div>
  </div>`;
}
function rankTable(list,isTop){

}

function orgDiagScope(){

const ORG_THRESHOLDS={span:10, workload:65, latency:60, density:companyManagementDensity*0.7};
function orgDiagSection(){

    <div class="table-wrap"><table><thead><tr><th>Manager</th><th>Dept</th><th>Span</th><th>Workload pressure</th><th>Decision latency</th><th>Attrition (12mo)</th></tr></thead>
    <tbody>${mgrs.slice().sort((a,b)=>b.workloadPressureProxy-a.workloadPressureProxy).map(m=>`
      <tr>
        <td class="name">${mgrLink(m.id,m.name)}</td>
        <td>${deptLinkFn(m.deptId,DEPTS.find(d=>d.id===m.deptId).name)}</td>
        <td class="tabular" style="${m.spanOfControl>ORG_THRESHOLDS.span?'color:var(--critical);font-weight:700':''}">${m.spanOfControl}</td>
        <td>${barCell(m.workloadPressureProxy,100,m.workloadPressureProxy>=ORG_THRESHOLDS.workload?'var(--critical)':'var(--accent)')}</td>
        <td>${barCell(m.decisionLatencyProxy,100,m.decisionLatencyProxy>=ORG_THRESHOLDS.latency?'var(--critical)':'var(--accent)')}</td>
        <td class="tabular">${m.attritionRate12mo}%</td>
      </tr>`).join('')}</tbody></table></div>
  </div>
  <div class="card agent-intro">
    <div class="card-head">
      <h3>Bottleneck diagnostic agent</h3>
      <span class="hint">Illustrative prototype · human review required</span>
    </div>
    <p class="section-desc" style="margin:0 0 14px">
      Reads the structural signals above and names the smallest set of bottlenecks that explain the largest share of
      operating friction — as testable hypotheses with cited evidence, never as verdicts. It never rates, ranks, or
      flags an individual, and every finding needs your validation before it becomes an action.
    </p>
    <button class="btn ask" id="run-orgdiag-btn" ${state.orgDiagBusy?'disabled':''}>
      ${state.orgDiagBusy?'⏳ Analyzing…':(run?'⚡ Re-run diagnostic':'⚡ Run bottleneck diagnostic')}

function renderOrgDiagRun(run){
  const hyps=run.hypotheses||[];
  if(!hyps.length) return `<div class="empty-note">The agent returned no hypotheses.</div>`;
  return hyps.map((h,i)=>`
    <div class="card" style="border-left:3px solid var(--accent)">
      <div class="card-head">
        <h3>${i+1}. ${esc(h.title||'Untitled hypothesis')}</h3>

      </div>

      </div>
    </div>`).join('') + `<p class="hint">Illustrative prototype output. All calculations are aggregate proxies for this workspace — a human validates causes and owns any resulting decision.</p>`;
}
async function runOrgDiagnostic(){
  if(state.orgDiagBusy) return;
  const runKey=state.role+':'+(state.role==='hrbp'?currentHrbp().id:'company');
  state.orgDiagBusy=true; renderAll();
  try{
    const sample=await claude.use('sample');
    if(!sample){
      state.orgDiagRuns[runKey]={generatedAt:new Date().toLocaleString(), hypotheses:[{title:'AI assistant isn’t available in this preview context.',evidence:'',confidence:'Low',experiment:'',owner:'',successMeasure:''}]};
      return;
    }
    const sys=ORG_ANALYST_SYSTEM_PROMPT+`\n\nCurrent scope: ${scopeLabel()}. Use the get_org_diagnostics and get_top_attrition_risks tools to pull real figures for this scope before writing anything — never invent numbers. All data is simulated demo data, not a real company.\n\n`+
      `Produce a JSON object with EXACTLY this shape:\n`+
      `{"hypotheses":[{"title":string,"evidence":string,"confidence":"High"|"Medium"|"Low","experiment":string,"owner":string,"successMeasure":string}]} // 2-3 hypotheses, ranked by impact × evidence strength × reversibility, most impactful first.\n\n`+
      `Return ONLY the JSON object.`;
    const result=await sample.json(sys,{tools:AI_TOOLS, modelTier:'default'});
    state.orgDiagRuns[runKey]={...result, generatedAt:new Date().toLocaleString()};
  }catch(err){

/* ---------- SHARED: Alert Center (spike detection + auto email draft) ---------- */
function detectSpikes(deptIds){
  const alerts=[];
  deptIds.forEach(id=>{
    const dept=DEPTS.find(d=>d.id===id);
    const series=deptAttritionSeries[id];
    const last=series[series.length-1], prev=series[series.length-2];
    if(prev>0 && (last-prev)/prev>=0.35){
      alerts.push({severity:'High',metric:'Attrition rate',dept:dept.name,deptId:id,
        text:`${dept.name}'s monthly attrition rate jumped from ${prev}% to ${last}% month-over-month (+${round1((last-prev)/prev*100)}%).`});
    }
    const engSeries=deptEngagementSeries[id];
    const eLast=engSeries[engSeries.length-1], eFirst=engSeries[engSeries.length-4]!=null?engSeries[engSeries.length-4]:engSeries[0];
    if(eFirst-eLast>=8){
      alerts.push({severity:'Medium',metric:'Engagement drop',dept:dept.name,deptId:id,
        text:`${dept.name}'s engagement dropped ${round1(eFirst-eLast)} pts over the last 3 pulses (${eFirst} → ${eLast}).`});
    }
  });
  const erCount=ER_CASES.filter(c=>deptIds.includes(c.deptId) && c.stage!=='Closed').length;
  if(erCount>=6){
    alerts.push({severity:'Medium',metric:'ER case volume',dept:'All scoped departments',deptId:null,
      text:`${erCount} open Employee Relations cases in scope — above this workspace's typical caseload.`});
  }
  const order={High:0,Medium:1,Low:2};
  return alerts.sort((a,b)=>order[a.severity]-order[b.severity]);
}
function alertCenterSection(){
  const deptIds=state.role==='hrbp'?hrbpDepts():DEPTS.map(d=>d.id);

async function generateAlertEmail(idx){
  const deptIds=state.role==='hrbp'?hrbpDepts():DEPTS.map(d=>d.id);
  const alerts=detectSpikes(deptIds);
  const a=alerts[idx]; if(!a) return;
  const runKey=state.role+':'+(state.role==='hrbp'?currentHrbp().id:'company');
  if(!state.alertDrafts[runKey]) state.alertDrafts[runKey]={};
  const fallback={to:'People Leadership',subject:`[Alert] ${a.metric} spike — ${a.dept}`,
    body:`Flagging a ${a.severity.toLowerCase()}-severity signal from Tap In:\n\n${a.text}\n\nRecommend a quick review this week. This is an automated, illustrative alert from simulated workspace data — please validate before acting.`};
  try{
    const sample=await claude.use('sample');
    if(!sample){ state.alertDrafts[runKey][idx]=fallback; renderAll(); return; }
    const sys=`You are Tap In's alert-drafting assistant. Write a short, professional email alerting people leadership to this detected spike: "${a.text}" (severity: ${a.severity}, metric: ${a.metric}, scope: ${a.dept}). `+
      `Return ONLY a JSON object: {"to":string,"subject":string,"body":string}. Keep the body under 120 words, factual, and end by asking the recipient to review — never claim a root cause you don't have evidence for.`;
    const result=await sample.json(sys,{modelTier:'quick'});
    state.alertDrafts[runKey][idx]=result;
  }catch(err){
    state.alertDrafts[runKey][idx]=fallback;
  }
  renderAll();
}

async function triggerDownload(text){
  try{
    const downloads=await claude.use('downloads');
    if(downloads){
      await downloads.save({filename:'tap-in-executive-report.md', data:text});
      return;
    }

function toCSV(headers, rows){
  const escv=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  return [headers.map(escv).join(','), ...rows.map(r=>r.map(escv).join(','))].join('\r\n');
}

async function downloadReportPDF(){
  const text=window.__lastReport||'';
  const scope=window.__lastReportScope||'tap-in';
  try{
    const jspdfNs=window.jspdf;
    if(!jspdfNs) throw new Error('jsPDF not loaded');
    const doc=new jspdfNs.jsPDF({unit:'pt',format:'letter'});
    doc.setFont('Courier','normal'); doc.setFontSize(9);
    const lines=doc.splitTextToSize(text, 500);
    let y=54;
    lines.forEach(line=>{
      if(y>740){ doc.addPage(); y=54; }
      doc.text(line, 54, y);
      y+=12;
    });
    const blob=doc.output('blob');
    const downloads=await claude.use('downloads');
    if(downloads){ await downloads.save({filename:`tap-in-summary-${slugify(scope)}.pdf`, data:blob}); return; }
  }catch(err){}
  alert('PDF download isn\'t available in this preview.');
}

function searchPolicyLibrary(query){
  const q=(query||'').toLowerCase();
  const terms=q.split(/\s+/).filter(Boolean);
  const scored=POLICY_LIBRARY.map(doc=>{
    const hay=(doc.title+' '+doc.category+' '+doc.tags.join(' ')+' '+doc.summary).toLowerCase();
    const score=terms.reduce((s,t)=>s+(hay.includes(t)?1:0),0);
    return {doc,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  return scored.slice(0,5).map(x=>({title:x.doc.title,category:x.doc.category,summary:x.doc.summary}));
}

    appendMsg('bot', state.assistMode==='policy'
      ? 'Hi — I search Tap In\'s internal policy, SOP and intranet library. Ask me if a resource already exists before you draft something new.'
      : `Hi — I'm your Tap In data analyst. I can see the data for your current view (${scopeLabel()}). Ask me about risk, performance, or coaching, or try a suggestion below.`);
  }
  document.getElementById('assist-text').focus();
}
function closeAssistant(){
  document.getElementById('assist-drawer').classList.remove('open');
  document.getElementById('assist-backdrop').classList.remove('open');
}
function appendMsg(role,text,cls){
  const box=assistMsgsEl();
  const div=document.createElement('div');
  div.className='msg '+role+(cls?' '+cls:'');
  div.textContent=text;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  return div;
}
async function submitAssistant(){
  if(assistBusy) return;
  const input=document.getElementById('assist-text');
  const text=input.value.trim();
  if(!text) return;
  const mode=state.assistMode;
  input.value='';
  appendMsg('user',text);
  const thinking=appendMsg('bot','Thinking…','thinking');
  assistBusy=true;
  document.querySelector('#assist-form button').disabled=true;
  try{
    const sample=await claude.use('sample');
    if(!sample){
      thinking.remove();
      appendMsg('sys','The AI assistant isn\'t available in this preview context.');
      return;
    }
    const sys = mode==='policy' ? POLICY_SYSTEM_PROMPT : ORG_ANALYST_SYSTEM_PROMPT+`\n\n`+
      `The current viewer's persona is: ${scopeLabel()}. Only discuss data within their scope — never claim visibility into data outside it. `+
      `Use the provided tools to look up real figures before answering; never invent numbers. Be concise (2-6 sentences or a short list) unless the question needs a ranked list of hypotheses. `+
      `All data is simulated demo data, not a real company — you can say so if asked.`;
    const res=await sample([{role:'user',content:sys+'\n\nQuestion: '+text}],{
      tools: mode==='policy' ? POLICY_TOOLS : AI_TOOLS,
      modelTier:'quick',
      onText:({text:t})=>{ thinking.classList.remove('thinking'); thinking.textContent=t; assistMsgsEl().scrollTop=9e9; }
    });
    thinking.classList.remove('thinking');
    thinking.textContent=res.text||'(no response)';
  }catch(err){
    thinking.classList.remove('thinking');
    thinking.textContent='Something went wrong reaching the assistant: '+(err && err.message?err.message:'unknown error');
  }finally{
    assistBusy=false;
    document.querySelector('#assist-form button').disabled=false;
  }
}

/* ================================================================
   9. WIRE STATIC UI + INIT
   ================================================================ */
document.getElementById('assist-toggle').addEventListener('click',openAssistant);
document.getElementById('assist-close').addEventListener('click',closeAssistant);
document.querySelectorAll('.assist-tab').forEach(t=>t.addEventListener('click',()=>setAssistMode(t.dataset.mode)));
document.getElementById('assist-backdrop').addEventListener('click',closeAssistant);
document.getElementById('assist-form').addEventListener('submit',e=>{e.preventDefault(); submitAssistant();});

renderShell();
renderAll();
wireDrillDownDelegation();

})();
</script>
